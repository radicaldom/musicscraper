[project]
name = "musicscraper"
version = "0.1.0"
description = "AI-driven music discovery that auto-queues albums in Soulseek (slskd)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mutagen>=1.47",
]

[project.scripts]
musicscraper = "musicscraper.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
